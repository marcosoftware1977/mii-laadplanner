<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laadplanner v3</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2563eb"><style>body{font-family:system-ui;max-width:420px;margin:auto;padding:16px}label{display:block;margin-top:12px;font-weight:600}input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}button{width:100%;border:none;border-radius:10px;padding:14px;margin-top:10px;color:#fff;background:#2563eb;font-size:17px;font-weight:600}.green{background:#16a34a}.red{background:#dc2626}.result{margin-top:15px;padding:14px;background:#eef4ff;border-radius:12px}.big{font-size:42px;font-weight:800;color:#2563eb}.countdown{font-size:32px;font-weight:700;color:#dc2626}.flash{animation:flash .6s infinite}@keyframes flash{0%{background:#fff}50%{background:#ff4444}100%{background:#fff}}.version{text-align:center;color:#777;margin-top:20px}</style></head><body><h2>🔋 Laadplanner</h2><label>Auto</label><select id="car"><option value="mii">Seat Mii Electric</option><option value="tesla">Tesla Model 3 LR</option></select><label>Huidige lading (%)</label><input id="cur" type="number" value="70"><label>Gewenste lading (%)</label><input id="tar" type="number" value="90"><label>Laadstroom (A)</label><input id="amp" type="number" value="8"><label>Laadverlies (%)</label><input id="loss" type="number" value="8"><div id="info"></div><button id="calcBtn">Bereken</button><button id="notifyBtn" class="green">🔔 Notificaties toestaan</button><button id="testSoundBtn" class="green">🔊 Test geluid</button><button id="clearBtn" class="red">🗑 Wis stoptijd</button><div id="res" class="result" style="display:none"></div><button id="stopAlarmBtn" class="green" style="display:none">🔕 Stop alarm</button><div class="version">v3.0</div><script>if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js')}const cars={mii:{cap:30.3,phases:2},tesla:{cap:75,phases:3}};let alarmInterval=null,audioCtx=null,audioUnlocked=false;const car=car=document.getElementById('car'),cur=document.getElementById('cur'),tar=document.getElementById('tar'),amp=document.getElementById('amp'),loss=document.getElementById('loss'),info=document.getElementById('info'),res=document.getElementById('res');function save(){localStorage.setItem('settings',JSON.stringify({car:car.value,cur:cur.value,tar:tar.value,amp:amp.value,loss:loss.value}))}function load(){let s=localStorage.getItem('settings');if(!s)return;let d=JSON.parse(s);car.value=d.car||'mii';cur.value=d.cur||70;tar.value=d.tar||90;amp.value=d.amp||8;loss.value=d.loss||8}function upd(){const p=(230*Number(amp.value)*cars[car.value].phases)/1000;info.innerHTML='<br><strong>'+amp.value+'A → '+p.toFixed(2).replace('.',',')+' kW</strong>';save()}load();upd();[car,cur,tar,amp,loss].forEach(e=>e.addEventListener('input',upd));document.getElementById('notifyBtn').onclick=async()=>{if(Notification.permission!=='granted')await Notification.requestPermission();alert('Notificaties ingesteld')};document.getElementById('testSoundBtn').onclick=()=>{if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);g.gain.value=.3;o.frequency.value=1400;o.start();o.stop(audioCtx.currentTime+.5)};document.getElementById('calcBtn').onclick=()=>{if(!audioUnlocked){audioCtx=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();audioUnlocked=true}const cfg=cars[car.value];const battery=((Number(tar.value)-Number(cur.value))/100)*cfg.cap;if(battery<=0){alert('Doelpercentage moet hoger zijn');return}const wall=battery/(1-Number(loss.value)/100);const power=(230*Number(amp.value)*cfg.phases)/1000;const stopTime=Date.now()+((wall/power)*3600000);localStorage.setItem('stopTime',stopTime);render()};document.getElementById('clearBtn').onclick=()=>{localStorage.removeItem('stopTime');location.reload()};function triggerAlarm(){if(alarmInterval)return;document.body.classList.add('flash');document.getElementById('stopAlarmBtn').style.display='block';if(Notification.permission==='granted'){new Notification('🔋 Tijd om laden te stoppen',{body:'Open E-Flux en stop laden'})}if(!audioCtx)return;alarmInterval=setInterval(()=>{const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.type='square';o.frequency.value=1400;o.connect(g);g.connect(audioCtx.destination);g.gain.value=.25;o.start();o.stop(audioCtx.currentTime+.5)},1000)}document.getElementById('stopAlarmBtn').onclick=()=>{clearInterval(alarmInterval);alarmInterval=null;document.body.classList.remove('flash');document.getElementById('stopAlarmBtn').style.display='none'};function updateCountdown(){const stopTime=Number(localStorage.getItem('stopTime'));if(!stopTime)return;const diff=stopTime-Date.now();const d=new Date(stopTime);if(diff<=0){triggerAlarm();return}res.style.display='block';const h=Math.floor(diff/3600000),m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);res.innerHTML='<div>STOP LADEN OM</div><div class="big">'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+'</div><hr><div>Nog:</div><div class="countdown">'+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'</div>'}function render(){updateCountdown();setInterval(updateCountdown,1000)}render();</script></body></html>
