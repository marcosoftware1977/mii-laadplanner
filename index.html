<!DOCTYPE html><html lang='nl'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Laadplanner</title><link rel='manifest' href='manifest.json'><meta name='theme-color' content='#2563eb'><style>body{font-family:system-ui;max-width:420px;margin:auto;padding:16px}label{display:block;margin-top:10px;font-weight:600}input,select,button{width:100%;padding:12px;border-radius:10px}input,select{border:1px solid #ccc}button{border:0;background:#2563eb;color:#fff;font-size:17px;margin-top:10px}.secondary{background:#16a34a}.r{display:none;background:#eef4ff;padding:14px;border-radius:12px;margin-top:12px}.big{font-size:38px;font-weight:700;color:#2563eb}</style></head><body><h2>🔋 Laadplanner</h2><label>Auto</label><select id='car'><option value='mii'>Seat Mii Electric</option><option value='tesla'>Tesla Model 3 LR</option></select><label>Huidige lading (%)</label><input id='cur' type='number' value='70'><label>Gewenste lading (%)</label><input id='tar' type='number' value='90'><label>Laadstroom (A)</label><input id='amp' type='number' value='8'><label>Laadverlies (%)</label><input id='loss' type='number' value='8'><div id='info'></div><button onclick='calc()'>Bereken</button><div id='res' class='r'></div><button id='timerBtn' class='secondary' style='display:none'>⏱ Start Android timer</button><script>if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js')}const cars={mii:{cap:30.3,p:2},tesla:{cap:75,p:3}};function save(){localStorage.setItem('lp',JSON.stringify({car:car.value,cur:cur.value,tar:tar.value,amp:amp.value,loss:loss.value}))}function load(){let d=localStorage.getItem('lp');if(!d)return;d=JSON.parse(d);for(let k in d){if(document.getElementById(k))document.getElementById(k).value=d[k]}}function upd(){let c=cars[car.value];info.innerText=amp.value+'A → '+(230*amp.value*c.p/1000).toFixed(2)+' kW';save()}load();['car','cur','tar','amp','loss'].forEach(id=>document.getElementById(id).addEventListener('input',upd));upd();let secs=0;function calc(){let c=cars[car.value];let battery=((tar.value-cur.value)/100)*c.cap;if(battery<=0)return;let wall=battery/(1-loss.value/100);let power=230*amp.value*c.p/1000;let hrs=wall/power;secs=Math.round(hrs*3600);let stop=new Date(Date.now()+secs*1000);res.style.display='block';timerBtn.style.display='block';res.innerHTML='<div>STOP LADEN OM</div><div class=big>'+String(stop.getHours()).padStart(2,'0')+':'+String(stop.getMinutes()).padStart(2,'0')+'</div><hr><div>Laadtijd: '+Math.floor(hrs)+'u '+Math.round((hrs%1)*60)+'m</div><div>Energie: '+wall.toFixed(1)+' kWh</div>';}
document.getElementById('timerBtn').onclick=function(){window.location.href='intent:#Intent;action=android.intent.action.SET_TIMER;i.length='+secs+';S.message=Laadpaal stoppen;end';};</script></body></html>
