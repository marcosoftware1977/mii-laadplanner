<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laadplanner</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<style>
body{font-family:system-ui;max-width:420px;margin:auto;padding:16px}
label{display:block;margin-top:12px;font-weight:600}
input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}
button{width:100%;border:0;border-radius:10px;padding:14px;margin-top:12px;color:white;background:#2563eb;font-size:17px;font-weight:600}
.secondary{background:#16a34a}.result{display:none;background:#eef4ff;padding:14px;border-radius:12px;margin-top:15px}.big{font-size:40px;font-weight:800;color:#2563eb}
</style>
</head><body>
<h2>🔋 Laadplanner</h2>
<label>Auto</label><select id="car"><option value="mii">Seat Mii Electric</option><option value="tesla">Tesla Model 3 LR</option></select>
<label>Huidige lading (%)</label><input id="cur" type="number" value="70">
<label>Gewenste lading (%)</label><input id="tar" type="number" value="90">
<label>Laadstroom (A)</label><input id="amp" type="number" value="8">
<label>Laadverlies (%)</label><input id="loss" type="number" value="8">
<div id="info"></div>
<button id="calcBtn">Bereken</button>
<div id="res" class="result"></div>
<button id="timerBtn" class="secondary" style="display:none">⏱ Start Android timer</button>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
const cars={mii:{cap:30.3,phases:2},tesla:{cap:75,phases:3}};
const car=document.getElementById('car');
const cur=document.getElementById('cur');
const tar=document.getElementById('tar');
const amp=document.getElementById('amp');
const loss=document.getElementById('loss');
const info=document.getElementById('info');
const res=document.getElementById('res');
const timerBtn=document.getElementById('timerBtn');
let timerSeconds=0;
function saveSettings(){localStorage.setItem('laadplanner',JSON.stringify({car:car.value,cur:cur.value,tar:tar.value,amp:amp.value,loss:loss.value}));}
function loadSettings(){const s=localStorage.getItem('laadplanner'); if(!s)return; const d=JSON.parse(s); car.value=d.car||'mii'; cur.value=d.cur||70; tar.value=d.tar||90; amp.value=d.amp||8; loss.value=d.loss||8;}
function updatePower(){const cfg=cars[car.value]; const power=(230*Number(amp.value)*cfg.phases)/1000; info.innerHTML='<br><strong>'+amp.value+'A → '+power.toFixed(2).replace('.',',')+' kW</strong>'; saveSettings();}
loadSettings(); updatePower();
[car,cur,tar,amp,loss].forEach(el=>el.addEventListener('input',updatePower));
document.getElementById('calcBtn').addEventListener('click',function(){
const cfg=cars[car.value]; const current=Number(cur.value); const target=Number(tar.value);
if(target<=current){alert('Doelpercentage moet hoger zijn dan huidige lading.'); return;}
const battery=((target-current)/100)*cfg.cap;
const wall=battery/(1-Number(loss.value)/100);
const power=(230*Number(amp.value)*cfg.phases)/1000;
const hours=wall/power;
 timerSeconds=Math.round(hours*3600);
 const stop=new Date(Date.now()+timerSeconds*1000);
 res.style.display='block'; timerBtn.style.display='block';
 res.innerHTML='<div>STOP LADEN OM</div><div class="big">'+String(stop.getHours()).padStart(2,'0')+':'+String(stop.getMinutes()).padStart(2,'0')+'</div>';
});
timerBtn.addEventListener('click',function(){window.location.href='intent:#Intent;action=android.intent.action.SET_TIMER;i.length='+timerSeconds+';S.message=Laadpaal stoppen;end';});
</script></body></html>
