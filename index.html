<!DOCTYPE html><html lang='nl'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Laadplanner</title><link rel='manifest' href='manifest.json'><meta name='theme-color' content='#2563eb'><style>body{font-family:system-ui;max-width:420px;margin:auto;padding:16px}label{display:block;margin-top:10px;font-weight:600}input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px}button{width:100%;padding:14px;background:#2563eb;color:#fff;border:0;border-radius:10px;margin-top:14px;font-size:18px}.r{display:none;background:#eef4ff;padding:14px;border-radius:12px;margin-top:12px}.big{font-size:40px;font-weight:700;color:#2563eb}</style></head><body><h2>🔋 Laadplanner</h2><label>Auto</label><select id='car'><option value='mii'>Seat Mii Electric</option><option value='tesla'>Tesla Model 3 LR</option></select><label>Huidige lading (%)</label><input id='cur' type='number' value='70'><label>Gewenste lading (%)</label><input id='tar' type='number' value='90'><label>Laadstroom (A)</label><input id='amp' type='number' value='8'><label>Laadverlies (%)</label><input id='loss' type='number' value='8'><div id='info'></div><button onclick='calc()'>Bereken</button><div id='res' class='r'></div><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}const cars={mii:{cap:30.3,p:2},tesla:{cap:75,p:3}};function upd(){let c=cars[car.value];info.innerText=amp.value+'A → '+(230*amp.value*c.p/1000).toFixed(2)+' kW'}car.onchange=upd;amp.oninput=upd;upd();function calc(){let c=cars[car.value];let battery=((tar.value-cur.value)/100)*c.cap;if(battery<=0)return;let wall=battery/(1-loss.value/100);let power=230*amp.value*c.p/1000;let hrs=wall/power;let stop=new Date(Date.now()+hrs*3600000);res.style.display='block';res.innerHTML='<div>STOP LADEN OM</div><div class=big>'+String(stop.getHours()).padStart(2,'0')+':'+String(stop.getMinutes()).padStart(2,'0')+'</div><hr><div>Laadtijd: '+Math.floor(hrs)+'u '+Math.round((hrs%1)*60)+'m</div><div>Energie: '+wall.toFixed(1)+' kWh</div><div>Vermogen: '+power.toFixed(2)+' kW</div>';}</script></body></html>
