<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laadplanner v3.1</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">

<style>
body{
    font-family:system-ui;
    max-width:420px;
    margin:auto;
    padding:16px;
}

label{
    display:block;
    margin-top:12px;
    font-weight:600;
}

input,select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    border:none;
    border-radius:10px;
    padding:14px;
    margin-top:10px;
    color:white;
    background:#2563eb;
    font-size:17px;
    font-weight:600;
}

.green{
    background:#16a34a;
}

.red{
    background:#dc2626;
}

.result{
    margin-top:15px;
    padding:14px;
    background:#eef4ff;
    border-radius:12px;
}

.big{
    font-size:42px;
    font-weight:800;
    color:#2563eb;
}

.countdown{
    font-size:32px;
    font-weight:700;
    color:#dc2626;
}

.flash{
    animation: flash .6s infinite;
}

@keyframes flash{
    0%{background:#fff;}
    50%{background:#ff4444;}
    100%{background:#fff;}
}

.version{
    margin-top:20px;
    color:#777;
    text-align:center;
    font-size:12px;
}
</style>
</head>

<body>

<h2>🔋 Laadplanner</h2>

<label>Auto</label>
<select id="car">
    <option value="mii">Seat Mii Electric</option>
    <option value="tesla">Tesla Model 3 LR</option>
</select>

<label>Huidige lading (%)</label>
<input id="cur" type="number" value="70">

<label>Gewenste lading (%)</label>
<input id="tar" type="number" value="90">

<label>Laadstroom (A)</label>
<input id="amp" type="number" value="8">

<label>Laadverlies (%)</label>
<input id="loss" type="number" value="8">

<div id="info"></div>

<button id="calcBtn">Bereken</button>

<button id="notifyBtn" class="green">
🔔 Notificaties toestaan
</button>

<button id="testSoundBtn" class="green">
🔊 Test geluid
</button>

<button id="clearBtn" class="red">
🗑 Wis stoptijd
</button>

<div id="res" class="result" style="display:none"></div>

<button id="stopAlarmBtn" class="green" style="display:none">
🔕 Stop alarm
</button>

<div class="version">
v3.1
</div>

<script>

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}

const cars = {
    mii: {
        cap: 30.3,
        phases: 2
    },
    tesla: {
        cap: 75,
        phases: 3
    }
};

const car = document.getElementById('car');
const cur = document.getElementById('cur');
const tar = document.getElementById('tar');
const amp = document.getElementById('amp');
const loss = document.getElementById('loss');
const info = document.getElementById('info');
const res = document.getElementById('res');
const stopAlarmBtn = document.getElementById('stopAlarmBtn');

let audioCtx = null;
let alarmInterval = null;
let countdownInterval = null;
let audioUnlocked = false;

function saveSettings() {

    localStorage.setItem(
        'settings',
        JSON.stringify({
            car: car.value,
            cur: cur.value,
            tar: tar.value,
            amp: amp.value,
            loss: loss.value
        })
    );
}

function loadSettings() {

    const saved =
        localStorage.getItem('settings');

    if (!saved) return;

    const s = JSON.parse(saved);

    car.value = s.car || 'mii';
    cur.value = s.cur || 70;
    tar.value = s.tar || 90;
    amp.value = s.amp || 8;
    loss.value = s.loss || 8;
}

function updatePower() {

    const cfg = cars[car.value];

    const power =
        (230 *
        Number(amp.value) *
        cfg.phases) / 1000;

    info.innerHTML =
        '<br><strong>' +
        amp.value +
        'A → ' +
        power.toFixed(2).replace('.', ',') +
        ' kW</strong>';

    saveSettings();
}

async function requestNotifications() {

    if (Notification.permission !== 'granted') {

        await Notification.requestPermission();
    }

    alert('Notificaties ingesteld');
}

function unlockAudio() {

    if (audioUnlocked) return;

    audioCtx =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    audioCtx.resume();

    audioUnlocked = true;
}

function playBeep() {

    if (!audioCtx) return;

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.type = 'square';

    osc.frequency.value = 1400;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    gain.gain.value = 0.25;

    osc.start();

    osc.stop(
        audioCtx.currentTime + 0.5
    );
}

function triggerAlarm() {

    if (alarmInterval) return;

    document.body.classList.add('flash');

    stopAlarmBtn.style.display = 'block';

    if (Notification.permission === 'granted') {

        new Notification(
            '🔋 Tijd om laden te stoppen',
            {
                body:
                    'Open E-Flux en stop de laadsessie'
            }
        );
    }

    playBeep();

    alarmInterval =
        setInterval(playBeep, 1000);
}

function stopAlarm() {

    clearInterval(alarmInterval);

    alarmInterval = null;

    document.body.classList.remove('flash');

    stopAlarmBtn.style.display = 'none';
}

function updateCountdown() {

    const stopTime =
        Number(
            localStorage.getItem('stopTime')
        );

    if (!stopTime) return;

    const diff =
        stopTime - Date.now();

    if (diff <= 0) {

        triggerAlarm();
        return;
    }

    const stopDate = new Date(stopTime);

    const hh =
        String(stopDate.getHours())
        .padStart(2, '0');

    const mm =
        String(stopDate.getMinutes())
        .padStart(2, '0');

    const h =
        Math.floor(diff / 3600000);

    const m =
        Math.floor(
            (diff % 3600000) / 60000
        );

    const s =
        Math.floor(
            (diff % 60000) / 1000
        );

    res.style.display = 'block';

    res.innerHTML =
        '<div>STOP LADEN OM</div>' +
        '<div class="big">' +
        hh + ':' + mm +
        '</div>' +
        '<hr>' +
        '<div>Nog:</div>' +
        '<div class="countdown">' +
        String(h).padStart(2, '0') + ':' +
        String(m).padStart(2, '0') + ':' +
        String(s).padStart(2, '0') +
        '</div>';
}

function startCountdown() {

    if (countdownInterval) {
        clearInterval(countdownInterval);
    }

    updateCountdown();

    countdownInterval =
        setInterval(
            updateCountdown,
            1000
        );
}

function calculate() {

    unlockAudio();

    const cfg = cars[car.value];

    const battery =
        ((Number(tar.value) -
        Number(cur.value)) / 100)
        * cfg.cap;

    if (battery <= 0) {

        alert(
            'Doelpercentage moet hoger zijn dan huidige lading.'
        );

        return;
    }

    const wall =
        battery /
        (1 - Number(loss.value) / 100);

    const power =
        (230 *
        Number(amp.value) *
        cfg.phases) / 1000;

    const hours =
        wall / power;

    const stopTime =
        Date.now() +
        (hours * 3600000);

    localStorage.setItem(
        'stopTime',
        stopTime
    );

    startCountdown();
}

function clearStopTime() {

    localStorage.removeItem('stopTime');

    location.reload();
}

loadSettings();
updatePower();

[car, cur, tar, amp, loss]
.forEach(el =>
    el.addEventListener(
        'input',
        updatePower
    )
);

document.getElementById('calcBtn')
.addEventListener('click', calculate);

document.getElementById('notifyBtn')
.addEventListener(
    'click',
    requestNotifications
);

document.getElementById('testSoundBtn')
.addEventListener('click', () => {

    unlockAudio();

    playBeep();
});

document.getElementById('clearBtn')
.addEventListener(
    'click',
    clearStopTime
);

stopAlarmBtn
.addEventListener(
    'click',
    stopAlarm
);

if (
    localStorage.getItem('stopTime')
) {
    startCountdown();
}

</script>

</body>
</html>
