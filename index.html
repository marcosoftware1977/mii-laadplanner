<!DOCTYPE html><html lang='nl'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Laadplanner v4</title><link rel='manifest' href='manifest.json'><style>body{font-family:system-ui;max-width:420px;margin:auto;padding:16px}input,select,button{width:100%;padding:12px;margin-top:8px;box-sizing:border-box}button{border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700}.green{background:#16a34a}.red{background:#dc2626}.card{background:#eef4ff;padding:12px;border-radius:10px;margin-top:12px}.big{font-size:40px;color:#2563eb;font-weight:800}.count{font-size:28px;color:#dc2626;font-weight:700}.flash{animation:f .6s infinite}@keyframes f{50%{background:#ff4444}}</style></head><body><h2>🔋 Laadplanner v4</h2><select id='car'><option value='mii'>Seat Mii Electric</option><option value='tesla'>Tesla Model 3 LR</option></select><input id='cur' type='number' value='70' placeholder='Huidig %'><input id='tar' type='number' value='90' placeholder='Doel %'><input id='amp' type='number' value='8' placeholder='Ampere'><input id='loss' type='number' value='8' placeholder='Verlies %'><div id='info'></div><button id='calc'>Bereken</button><button id='notify' class='green'>🔔 Notificaties toestaan</button><button id='test' class='green'>🔊 Test geluid</button><button id='stop' class='green' style='display:none'>🔕 Stop alarm</button><button id='clear' class='red'>🗑 Wis stoptijd</button><div id='res' class='card' style='display:none'></div><script>if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js')}const cars={mii:{cap:30.3,p:2},tesla:{cap:75,p:3}};let countdown=null,alarmTimer=null,alarmTriggered=false;function save(){localStorage.setItem('lp4',JSON.stringify({car:car.value,cur:cur.value,tar:tar.value,amp:amp.value,loss:loss.value}))}function load(){let s=localStorage.getItem('lp4');if(!s)return;let d=JSON.parse(s);for(let k in d){let e=document.getElementById(k);if(e)e.value=d[k]}}function power(){return 230*Number(amp.value)*cars[car.value].p/1000}function upd(){info.innerHTML='<b>'+amp.value+'A → '+power().toFixed(2)+' kW</b>';save()}function beep(){const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);g.gain.value=.3;o.frequency.value=1400;o.start();o.stop(ctx.currentTime+.4)}document.getElementById('test').onclick=()=>beep();document.getElementById('notify').onclick=async()=>{if(Notification.permission!=='granted')await Notification.requestPermission()};function triggerAlarm(){if(alarmTriggered)return;alarmTriggered=true;document.body.classList.add('flash');stop.style.display='block';try{if(Notification.permission==='granted'){new Notification('🔋 Tijd om laden te stoppen',{body:'Open E-Flux en stop laden',requireInteraction:true})}}catch(e){};if(navigator.vibrate)navigator.vibrate([500,200,500,200,500]);beep();alarmTimer=setInterval(beep,1500)}function render(){const st=Number(localStorage.getItem('stopTime'));if(!st)return;const diff=st-Date.now();res.style.display='block';if(diff<=0){res.innerHTML='<div class=big>GEREED</div>';triggerAlarm();return}const d=new Date(st);const h=Math.floor(diff/3600000),m=Math.floor(diff%3600000/60000),s=Math.floor(diff%60000/1000);res.innerHTML='<div>STOP LADEN OM</div><div class=big>'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+'</div><div class=count>'+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'</div>'}calc.onclick=()=>{const batt=((Number(tar.value)-Number(cur.value))/100)*cars[car.value].cap;if(batt<=0){alert('Doel moet hoger zijn');return}const wall=batt/(1-Number(loss.value)/100);const hrs=wall/power();localStorage.setItem('stopTime',Date.now()+hrs*3600000);alarmTriggered=false;render()};stop.onclick=()=>{if(alarmTimer)clearInterval(alarmTimer);alarmTimer=null;document.body.classList.remove('flash');stop.style.display='none';alarmTriggered=true};clear.onclick=()=>{localStorage.removeItem('stopTime');location.reload()};load();upd();[car,cur,tar,amp,loss].forEach(e=>e.addEventListener('input',upd));render();countdown=setInterval(render,1000);</script></body></html>
